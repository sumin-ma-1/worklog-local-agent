[project]
name = "worklog-local-agent"
version = "0.1.0"
description = "텔레그램 채팅 활동을 수집해 날짜별 업무 일지를 만드는 로컬 에이전트"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.36,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "typer>=0.12,<0.16",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
]

[project.scripts]
worklog-agent = "worklog_agent.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
