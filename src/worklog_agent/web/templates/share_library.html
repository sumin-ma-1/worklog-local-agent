<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Worklog · 공유 일지</title>
  <link rel="icon" href="/static/favicon.png" type="image/png" sizes="64x64">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
  <link rel="stylesheet" href="/static/dashboard.css?v=share-cal-1">
</head>
<body class="share-mode">
  <main class="share-shell share-library-shell">
    <div class="share-library-layout">
      <div class="share-library-browse">
        <div class="panel share-calendar-panel">
          <div id="share-calendar" class="journal-calendar" aria-label="공유 일지 달력"></div>
        </div>
        <div class="panel share-library-list-panel">
          <ul id="share-journal-list" class="share-journal-list" aria-label="공유 일지 목록"></ul>
        </div>
      </div>
      <article class="panel share-panel share-library-detail" id="share-detail">
        <div class="journal-placeholder">
          <h3 class="journal-placeholder-title">일지를 선택하세요</h3>
          <p class="journal-placeholder-hint">달력이나 목록에서 날짜를 고르면 내용이 표시됩니다.</p>
        </div>
      </article>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script>
    const TOKEN = {{ token_json|safe }};
    const JOURNALS = {{ journals_json|safe }};
    const byDate = new Map(JOURNALS.map((item) => [item.date, item]));
    let selectedDay = JOURNALS[0]?.date || null;
    let calendarMonth = (() => {
      const match = /^(\d{4})-(\d{2})/.exec(selectedDay || "");
      if (match) return { y: Number(match[1]), m: Number(match[2]) };
      const now = new Date();
      return { y: now.getFullYear(), m: now.getMonth() + 1 };
    })();

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function formatDayTitle(day) {
      const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(day || ""));
      if (!match) return day;
      const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
      const weekdays = ["일", "월", "화", "수", "목", "금", "토"];
      return `${match[1]}년 ${Number(match[2])}월 ${Number(match[3])}일 ${weekdays[date.getDay()]}요일`;
    }

    function monthKey(y, m) {
      return `${y}-${String(m).padStart(2, "0")}`;
    }

    function renderList() {
      const list = document.getElementById("share-journal-list");
      if (!list) return;
      if (!JOURNALS.length) {
        list.innerHTML = `<li class="empty">공유된 일지가 없습니다.</li>`;
        return;
      }
      list.innerHTML = JOURNALS.map((item) => {
        const meta = [];
        if (item.has_journal) meta.push("일지");
        if (item.attachments) meta.push(`첨부 ${item.attachments}`);
        const selected = item.date === selectedDay ? " is-selected" : "";
        return `<li>
          <button type="button" class="share-journal-item${selected}" data-day="${escapeHtml(item.date)}">
            <strong>${escapeHtml(item.date)}</strong>
            <span>${escapeHtml(meta.join(" · ") || "기록")}</span>
          </button>
        </li>`;
      }).join("");
    }

    function renderCalendar() {
      const root = document.getElementById("share-calendar");
      if (!root) return;
      const { y, m } = calendarMonth;
      const firstWeekday = new Date(y, m - 1, 1).getDay();
      const daysInMonth = new Date(y, m, 0).getDate();
      const today = new Date();
      const todayKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
      const weekdayLabels = ["일", "월", "화", "수", "목", "금", "토"];
      let cells = "";
      for (let i = 0; i < firstWeekday; i += 1) {
        cells += `<div class="cal-cell empty" aria-hidden="true"></div>`;
      }
      for (let day = 1; day <= daysInMonth; day += 1) {
        const key = `${monthKey(y, m)}-${String(day).padStart(2, "0")}`;
        const item = byDate.get(key);
        const classes = ["cal-day"];
        if (item) classes.push("has-entry");
        if (item?.has_journal) classes.push("has-journal");
        if (key === todayKey) classes.push("is-today");
        if (key === selectedDay) classes.push("is-selected");
        cells += `
          <button type="button" class="${classes.join(" ")}" data-date="${key}" ${item ? "" : "disabled"}>
            <span class="cal-num">${day}</span>
            ${item ? `<span class="cal-dot" aria-hidden="true"></span>` : ""}
          </button>`;
      }
      root.innerHTML = `
        <div class="cal-head">
          <button type="button" class="icon-btn" id="share-cal-prev" title="이전 달" aria-label="이전 달">
            <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
          </button>
          <div class="cal-title">
            <span class="cal-picker-value">${y}</span><span class="cal-unit">년</span>
            <span class="cal-picker-value">${m}</span><span class="cal-unit">월</span>
          </div>
          <button type="button" class="icon-btn" id="share-cal-next" title="다음 달" aria-label="다음 달">
            <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
          </button>
        </div>
        <div class="cal-weekdays">${weekdayLabels.map((label) => `<span>${label}</span>`).join("")}</div>
        <div class="cal-grid">${cells}</div>
      `;
      document.getElementById("share-cal-prev")?.addEventListener("click", () => {
        calendarMonth.m -= 1;
        if (calendarMonth.m < 1) {
          calendarMonth.m = 12;
          calendarMonth.y -= 1;
        }
        renderCalendar();
      });
      document.getElementById("share-cal-next")?.addEventListener("click", () => {
        calendarMonth.m += 1;
        if (calendarMonth.m > 12) {
          calendarMonth.m = 1;
          calendarMonth.y += 1;
        }
        renderCalendar();
      });
      root.querySelectorAll(".cal-day[data-date]:not([disabled])").forEach((btn) => {
        btn.addEventListener("click", () => openDay(btn.dataset.date));
      });
    }

    async function openDay(day) {
      selectedDay = day;
      const match = /^(\d{4})-(\d{2})/.exec(day || "");
      if (match) {
        calendarMonth = { y: Number(match[1]), m: Number(match[2]) };
      }
      renderList();
      renderCalendar();
      const detail = document.getElementById("share-detail");
      if (!detail) return;
      detail.innerHTML = `<p class="empty">불러오는 중…</p>`;
      try {
        const response = await fetch(`/api/share/${encodeURIComponent(TOKEN)}?day=${encodeURIComponent(day)}`);
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(typeof data.detail === "string" ? data.detail : "일지를 불러오지 못했습니다.");
        }
        const markdown = data.markdown || "";
        let bodyHtml = `<p class="empty">이 날짜의 일지가 없습니다.</p>`;
        if (markdown) {
          if (window.marked && typeof window.marked.parse === "function") {
            bodyHtml = `<div class="journal-body markdown-body">${window.marked.parse(markdown)}</div>`;
          } else {
            bodyHtml = `<pre class="journal-body">${escapeHtml(markdown)}</pre>`;
          }
        }
        const attachments = Array.isArray(data.attachments) ? data.attachments : [];
        const attachHtml = attachments.length
          ? attachments
              .map(
                (file) => `<li>
                  <img class="attach-icon" src="${escapeHtml(file.icon || "")}" alt="" width="20" height="20">
                  <a href="${escapeHtml(file.href || "#")}" target="_blank" rel="noreferrer">${escapeHtml(file.name || "")}</a>
                </li>`
              )
              .join("")
          : `<li class="empty">첨부 없음</li>`;
        detail.innerHTML = `
          <div class="row-head"><h3>${escapeHtml(formatDayTitle(day))}</h3></div>
          ${bodyHtml}
          <div class="journal-attach">
            <h3>첨부</h3>
            <ul class="attach-list">${attachHtml}</ul>
          </div>
        `;
      } catch (err) {
        detail.innerHTML = `<p class="empty">${escapeHtml(err.message || "오류")}</p>`;
      }
    }

    document.getElementById("share-journal-list")?.addEventListener("click", (event) => {
      const btn = event.target.closest?.(".share-journal-item");
      if (!btn?.dataset.day) return;
      openDay(btn.dataset.day);
    });

    renderList();
    renderCalendar();
    if (selectedDay) openDay(selectedDay);
  </script>
</body>
</html>
