<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Worklog</title>
  <link rel="icon" href="/static/favicon.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
  <link rel="stylesheet" href="/static/dashboard.css?v=auth-ui-12">
</head>
<body class="login-mode">
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <section id="view-login" class="login-screen">
    <div class="login-brand">
      <img class="brand-logo" src="/static/worklog.jpg" alt="" width="44" height="44">
      <h1>Worklog</h1>
    </div>

    <div class="login-card">
      <p id="login-status" class="meta hidden">상태 확인 중…</p>

      <div id="auth-account-panel">
        <form id="account-form" class="auth-form">
          <label class="field-line">
            <span class="field-label">아이디</span>
            <span class="field-input-row">
              <input id="username-input" name="username" autocomplete="username" placeholder="아이디">
              <span class="field-hint register-only hidden" tabindex="0" aria-label="아이디 규칙" data-tip="영문 소문자·숫자·밑줄 3~32자">
                <span class="material-symbols-outlined" aria-hidden="true">info</span>
              </span>
            </span>
          </label>
          <label class="field-line">
            <span class="field-label">비밀번호</span>
            <span class="field-input-row">
              <input id="password-input" name="password" type="password" autocomplete="current-password" placeholder="비밀번호">
              <span class="field-hint register-only hidden" tabindex="0" aria-label="비밀번호 규칙" data-tip="8자 이상">
                <span class="material-symbols-outlined" aria-hidden="true">info</span>
              </span>
            </span>
          </label>
          <label id="password-confirm-wrap" class="field-line hidden">
            <span class="field-label">비밀번호 확인</span>
            <span class="field-input-row">
              <input id="password-confirm-input" name="password_confirm" type="password" autocomplete="new-password" placeholder="비밀번호 확인">
            </span>
          </label>
          <button type="submit" id="account-submit" class="auth-submit">로그인</button>
        </form>
      </div>

      <div id="auth-telegram-panel" class="hidden">
        <form id="login-form" class="auth-form">
          <label class="field-line">
            <span class="field-label">전화번호</span>
            <input id="login-phone-input" autocomplete="tel" placeholder="전화번호">
          </label>
          <button type="submit" id="login-submit" class="auth-submit">텔레그램 연동</button>
        </form>

        <form id="login-code-form" class="auth-form hidden">
          <label class="field-line">
            <span class="field-label">인증코드</span>
            <input id="login-code-input" inputmode="numeric" autocomplete="one-time-code" placeholder="인증코드">
          </label>
          <button type="submit" class="auth-submit">코드로 연동</button>
          <button type="button" class="ghost-btn" id="login-restart">처음부터</button>
        </form>

        <form id="login-password-form" class="auth-form hidden">
          <label class="field-line">
            <span class="field-label">2단계 인증 비밀번호</span>
            <input id="login-password-input" type="password" autocomplete="current-password" placeholder="2단계 인증 비밀번호">
          </label>
          <button type="submit" class="auth-submit">비밀번호로 연동</button>
          <button type="button" class="ghost-btn" id="login-restart-password">처음부터</button>
        </form>
      </div>
    </div>

    <nav class="auth-footer" id="auth-footer" aria-label="계정 전환">
      <button type="button" class="text-link" id="goto-register">가입하기</button>
      <button type="button" class="text-link hidden" id="goto-login">로그인</button>
    </nav>
  </section>

  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar" id="app-sidebar">
      <div class="sidebar-top">
        <div class="sidebar-brand">
          <img class="brand-logo" src="/static/worklog.jpg" alt="Worklog" width="36" height="36">
          <h1>Worklog</h1>
        </div>
        <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-label="사이드바 접기" title="사이드바 접기">
          <span class="material-symbols-outlined" aria-hidden="true">thumbnail_bar</span>
        </button>
      </div>
      <nav>
        <button class="nav-btn active" data-view="journals" title="일지">
          <span class="nav-icon material-symbols-outlined" aria-hidden="true">folder</span>
          <span class="nav-label">일지</span>
        </button>
        <button class="nav-btn" data-view="chats" title="업무방">
          <span class="nav-icon material-symbols-outlined" aria-hidden="true">quick_phrases</span>
          <span class="nav-label">업무방</span>
        </button>
        <button class="nav-btn" data-view="run" title="일지 생성">
          <span class="nav-icon material-symbols-outlined" aria-hidden="true">code</span>
          <span class="nav-label">일지 생성</span>
        </button>
        <button class="nav-btn admin-only hidden" id="nav-accounts" data-view="accounts" title="계정 관리">
          <span class="nav-icon material-symbols-outlined" aria-hidden="true">contacts_product</span>
          <span class="nav-label">계정 관리</span>
        </button>
      </nav>
      <div class="sidebar-meta" id="overview-meta"></div>
      <button type="button" id="sidebar-logout" class="nav-btn logout-btn" title="로그아웃">
        <span class="nav-icon material-symbols-outlined" aria-hidden="true">logout</span>
        <span class="nav-label">로그아웃</span>
      </button>
    </aside>

    <main>
      <section id="view-journals" class="view">
        <div class="split">
          <div class="journal-browse">
            <div class="panel journal-calendar-panel">
              <div id="journal-calendar" class="journal-calendar" aria-label="일지 달력"></div>
            </div>
            <div class="panel journal-list-panel">
              <div class="list-scroll-wrap" id="journal-list-wrap">
                <div class="list-scroll" id="journal-list-scroll">
                  <ul id="journal-list" class="list"></ul>
                </div>
              </div>
            </div>
          </div>
          <div class="panel detail journal-detail-panel" id="journal-detail">
            <p class="empty">왼쪽에서 날짜를 선택하세요.</p>
          </div>
        </div>
      </section>

      <section id="view-chats" class="view hidden">
        <div class="split">
          <div class="panel">
            <h3>수집 대상</h3>
            <form id="add-chat-form" class="inline-form">
              <input id="chat-id-input" name="id" placeholder="-1001234567890" autocomplete="off">
              <button type="submit" class="btn-with-icon">
                <span class="material-symbols-outlined" aria-hidden="true">add</span>
                ID로 추가
              </button>
            </form>
            <ul id="watched-list" class="list"></ul>
          </div>
          <div class="panel dialogs-panel">
            <div class="row-head">
              <h3>참여 대화 목록</h3>
              <button type="button" id="refresh-dialogs" class="icon-btn" title="다시 불러오기" aria-label="다시 불러오기">
                <span class="material-symbols-outlined" aria-hidden="true">refresh</span>
              </button>
            </div>
            <div class="search-field">
              <input id="dialog-filter" placeholder="제목 또는 ID 검색" autocomplete="off">
              <span class="material-symbols-outlined search-field-icon" aria-hidden="true">search</span>
            </div>
            <div class="list-scroll-wrap" id="dialog-scroll-wrap">
              <div class="list-scroll" id="dialog-scroll">
                <ul id="dialog-list" class="list"></ul>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="view-run" class="view hidden">
        <div class="panel narrow">
          <form id="run-form" class="stack-form">
            <label>
              날짜
              <input type="date" id="run-date" name="date" value="{{ today }}">
            </label>
            <button type="submit" id="run-button" class="btn-with-icon">
              <span class="run-button-idle">
                <span class="material-symbols-outlined" aria-hidden="true">backup</span>
                생성
              </span>
              <span class="run-button-busy" aria-hidden="true">
                <span class="busy-dot"></span>
                <span class="busy-dot"></span>
                <span class="busy-dot"></span>
              </span>
            </button>
          </form>
          <div class="job-panel">
            <ol id="job-steps" class="job-steps">
              <li data-step="collect">메시지 수집</li>
              <li data-step="archive">첨부 저장</li>
              <li data-step="organize">날짜 정리</li>
              <li data-step="model">모델 로드</li>
              <li data-step="journal">일지 생성</li>
            </ol>
          </div>
        </div>
      </section>

      <section id="view-accounts" class="view hidden">
        <div class="panel accounts-panel">
          <div class="row-head">
            <h3>가입 계정</h3>
            <button type="button" id="refresh-accounts" class="icon-btn" title="다시 불러오기" aria-label="다시 불러오기">
              <span class="material-symbols-outlined" aria-hidden="true">refresh</span>
            </button>
          </div>
          <div class="accounts-table-wrap">
            <table class="accounts-table" id="accounts-table">
              <thead>
                <tr>
                  <th>아이디</th>
                  <th>가입일</th>
                  <th>최근 접속</th>
                  <th>일지</th>
                  <th>텔레그램</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="accounts-tbody">
                <tr><td colspan="6" class="empty">불러오는 중…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="/static/dashboard.js?v=auth-ui-12"></script>
</body>
</html>
