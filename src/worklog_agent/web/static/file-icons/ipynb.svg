<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none" role="img" aria-label="ipynb file icon">
  <defs>
    <filter id="shadow" x="-8" y="-8" width="112" height="112" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#30415D" flood-opacity="0.08"/>
    </filter>
  </defs>

  <g filter="url(#shadow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- main document outline -->
    <path
      d="M28 8H58L78 28V74C78 79.523 73.523 84 68 84H28C22.477 84 18 79.523 18 74V18C18 12.477 22.477 8 28 8Z"
      fill="#FFFFFF" stroke="#5F708A" stroke-width="2"/>

    <!-- folded corner fill, kept completely inside the outer contour -->
    <path
      d="M58 8L78 28H64C60.686 28 58 25.314 58 22V8Z"
      fill="#E9EEF7"/>

    <!-- folded corner seam: no overshoot past the fold -->
    <path
      d="M58 9V22C58 25.314 60.686 28 64 28H77"
      stroke="#5F708A" stroke-width="2" fill="none"/>

    <rect x="26" y="16" width="8" height="8" rx="4" fill="#4B8EDB" stroke="none"/>
    <rect x="38" y="18" width="18" height="4" rx="2" fill="#D9E2F0" stroke="none"/>
    <rect x="28" y="61" width="40" height="3.5" rx="1.75" fill="#4B8EDB" opacity="0.14" stroke="none"/>
  </g>

  <text x="48" y="54" text-anchor="middle" fill="#4B8EDB" font-size="24" font-weight="700"
        font-family="Arial, Helvetica, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">Py</text>
</svg>
