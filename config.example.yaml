# 복사: cp config.example.yaml config.yaml
timezone: Asia/Seoul

telegram:
  session_name: worklog
  # worklog-agent chats 로 확인한 채팅방 제목 또는 ID
  chats:
    - "팀 업무방"
    # - -1001234567890

storage:
  root: data

collect:
  # lookback_days 는 사용하지 않습니다. 실행/수집 시 --date(또는 대시보드 날짜)만 반영됩니다.
  lookback_days: 7
  skip_service_messages: true

journal:
  language: ko
  temperature: 0.2
  ollama:
    host: http://127.0.0.1:11434
    model: gemma4:e4b
    timeout_seconds: 300
    num_ctx: 16384
